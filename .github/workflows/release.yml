name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm test
      - run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - run: npm run package
      - run: npx vsce publish --oidc --no-dependencies --packagePath oval-*.vsix
      - run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" oval-*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" oval-*.vsix --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
